plugins {
    id "net.fabricmc.fabric-loom"
}

base {
    archivesName = "fabric-sk"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation project(":fabric-sk-engine")
}

processResources {
    inputs.property "version", project.fabric_sk_version
    inputs.property "engine_version", project.engine_version
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand(
            version: project.fabric_sk_version,
            engine_version: project.engine_version,
            loader_version: project.loader_version,
            minecraft_version: project.minecraft_version
        )
    }
}

tasks.named("jar") {
    dependsOn(":fabric-sk-engine:jar")
    doLast {
        File engineJar = project(":fabric-sk-engine").tasks.named("jar").get().archiveFile.get().asFile
        File outputJar = archiveFile.get().asFile
        ant.zip(destfile: outputJar, update: true) {
            zipfileset(file: engineJar, fullpath: "META-INF/jars/fabric-sk-engine-${project.engine_version}.jar")
        }
    }
}

tasks.named("build") { dependsOn(tasks.named("jar")) }
